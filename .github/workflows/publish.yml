name: Publish
# Publishes @bazous/ui on npm when a release is published (tag vX.Y.Z = package.json version),
# with npm provenance. Can be run by hand for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.3.2)"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then echo "Tag $TAG does not match package.json $version"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Already on npm?
        run: |
          if npm view "@bazous/ui@$VERSION" version >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "@bazous/ui@$VERSION is already published"; fi
      - if: env.SKIP != '1'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
