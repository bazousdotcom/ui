name: Gallery
on:
  push:
    branches: [main]
  # The Community page ranks the open questions, rules and offers by their 👍: read again each day.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/rank-questions.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build:gallery
        env:
          GALLERY_BASE: /ui/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gallery-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
