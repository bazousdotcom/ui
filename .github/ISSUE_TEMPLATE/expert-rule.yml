name: Expert rule
description: Propose a rule of thumb the engine should apply (with its source; reviewed before use)
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: "A rule enters the Bazous engine only with a public source and after review. The engine computes; the rule only sets a threshold or a test. Vote with 👍."
  - type: input
    id: rule
    attributes:
      label: The rule, in one sentence
      placeholder: "Owner costs above 40 % of the rents eat the yield of a rental property"
    validations:
      required: true
  - type: input
    id: threshold
    attributes:
      label: The threshold or test, with its unit
      placeholder: "costs / rents > 40 %"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (link to a public page, law, regulator or professional body)
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Where it applies (country, canton, kind of household)
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: The question it improves, and what the answer would say
