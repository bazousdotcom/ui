name: New question
description: Suggest a money question Bazous should answer
labels: ["module"]
body:
  - type: input
    id: question
    attributes:
      label: The question, as a household would ask it
      placeholder: "How much can I set aside this month?"
    validations:
      required: true
  - type: textarea
    id: fields
    attributes:
      label: Snapshot fields needed
      description: See schema/snapshot.schema.json. If some are missing, say which.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: What the answer looks like
      description: A figure, a list, a curve, a picture? Invented data only.
