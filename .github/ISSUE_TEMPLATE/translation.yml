name: Translation
description: Fix or improve a translation
labels: ["translation"]
body:
  - type: dropdown
    id: lang
    attributes:
      label: Language
      options: [Français, Deutsch, Italiano, Rumantsch, English]
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Module and key
      placeholder: "low-point · label"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Current text and proposal
    validations:
      required: true
